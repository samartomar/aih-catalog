name: signed catalog v2

on:
  workflow_dispatch:
    inputs:
      commit_sha: { required: true, type: string }
      signed_catalog_sha256: { required: true, type: string }
      signed_catalog_path: { required: true, type: string }
      catalog_signer_root_path: { required: true, type: string }
      promotion_plan_sha256: { required: true, type: string }
      qualification_receipt_set_sha256: { required: true, type: string }
      qualification_receipt_issued_at: { required: true, type: string }
      continuity_mode: { required: true, type: string }
      last_accepted_head_path: { required: false, type: string }
      last_accepted_head_sha256: { required: false, type: string }

jobs:
  candidate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
      ACTUAL_DISPATCH_SHA: ${{ github.sha }}
      EXPECTED_REF: ${{ github.ref }}
      EXPECTED_REPOSITORY: ${{ github.repository }}
      EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
      EXPECTED_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
      EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
      EXPECTED_EVENT_NAME: ${{ github.event_name }}
      SIGNED_CATALOG_PATH: ${{ inputs.signed_catalog_path }}
      CATALOG_SIGNER_ROOT_PATH: ${{ inputs.catalog_signer_root_path }}
      CONTINUITY_MODE: ${{ inputs.continuity_mode }}
      LAST_ACCEPTED_HEAD_PATH: ${{ inputs.last_accepted_head_path }}
      EXPECTED_LAST_ACCEPTED_HEAD_SHA256: ${{ inputs.last_accepted_head_sha256 }}
      EXPECTED_QUALIFICATION_RECEIPT_SET_SHA256: ${{ inputs.qualification_receipt_set_sha256 }}
      QUALIFICATION_RECEIPT_ISSUED_AT: ${{ inputs.qualification_receipt_issued_at }}
      EXPECTED_CLAIMS_PATH: catalog-expected-claims.json
      CANDIDATE_ARTIFACT_PATH: signed-catalog-v2.json
      REGENERATED_CANDIDATE_PATH: regenerated-candidate.json
      EMBEDDED_CATALOG_HEAD_PATH: embedded-catalog-head.json
      CANDIDATE_SIGNER_PATH: candidate-signer.json
      CANDIDATE_METADATA_PATH: candidate-metadata.json
      PROMOTION_PLAN_PATH: promotion-plan.json
      QUALIFICATION_RECEIPT_SET_PATH: qualification-receipt-set.json
      QUALIFICATION_RECEIPT_DIRECTORY: receipts
      REPLAY_STATE_PATH: qualification-receipt-replay-state.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT_SHA }}
          persist-credentials: false
      - name: verify custody and emit every head receipt
        run: |
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ && "$ACTUAL_DISPATCH_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_REF" =~ ^refs/heads/main$ && "$EXPECTED_QUALIFICATION_RECEIPT_SET_SHA256" =~ ^[0-9a-f]{64}$ && "$QUALIFICATION_RECEIPT_ISSUED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          test "$EXPECTED_COMMIT_SHA" = "$ACTUAL_DISPATCH_SHA" && test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          issued_epoch=$(date -u -d "$QUALIFICATION_RECEIPT_ISSUED_AT" +%s); test "$(date -u -d "@$issued_epoch" +%Y-%m-%dT%H:%M:%SZ)" = "$QUALIFICATION_RECEIPT_ISSUED_AT"; skew=$(( $(date -u +%s) - issued_epoch )); (( skew >= -300 && skew <= 300 ))
          safe_workspace_file() { local requested="$1" workspace resolved; [[ "$requested" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ && "$requested" != *".."* ]]; workspace=$(realpath -e "$GITHUB_WORKSPACE"); resolved=$(realpath -e "$GITHUB_WORKSPACE/$requested"); [[ "$resolved" == "$workspace/"* ]] && ! test -L "$GITHUB_WORKSPACE/$requested" && git ls-files --error-unmatch -- "$requested" >/dev/null; }
          safe_workspace_file "$SIGNED_CATALOG_PATH"; safe_workspace_file "$CATALOG_SIGNER_ROOT_PATH"
          if [[ "$CONTINUITY_MODE" == genesis ]]; then [[ -z "$LAST_ACCEPTED_HEAD_PATH" && -z "$EXPECTED_LAST_ACCEPTED_HEAD_SHA256" ]]; continuity_args=(--continuity genesis); elif [[ "$CONTINUITY_MODE" == successor ]]; then [[ "$EXPECTED_LAST_ACCEPTED_HEAD_SHA256" =~ ^[0-9a-f]{64}$ ]]; safe_workspace_file "$LAST_ACCEPTED_HEAD_PATH"; test "$(sha256sum "$LAST_ACCEPTED_HEAD_PATH" | awk '{print $1}')" = "$EXPECTED_LAST_ACCEPTED_HEAD_SHA256"; continuity_args=(--last-accepted-head "$LAST_ACCEPTED_HEAD_PATH"); else exit 2; fi
          node -e "const fs=require('node:fs');fs.writeFileSync(process.env.EXPECTED_CLAIMS_PATH,JSON.stringify({environment:'catalog-signing',eventName:process.env.EXPECTED_EVENT_NAME,issuer:'https://token.actions.githubusercontent.com',jobWorkflowRef:process.env.EXPECTED_WORKFLOW_REF,ref:process.env.EXPECTED_REF,repository:process.env.EXPECTED_REPOSITORY,repositoryId:process.env.EXPECTED_REPOSITORY_ID,repositoryOwnerId:process.env.EXPECTED_REPOSITORY_OWNER_ID}))"
          npm ci --ignore-scripts && npm run build
          node dist/cli.js inspect --signed-catalog "$SIGNED_CATALOG_PATH" --catalog-signer-root "$CATALOG_SIGNER_ROOT_PATH" --expected-claims "$EXPECTED_CLAIMS_PATH" --now "$QUALIFICATION_RECEIPT_ISSUED_AT" "${continuity_args[@]}"
          printf '%s' '{"acceptedIdentities":[]}' > "$REPLAY_STATE_PATH"; mkdir "$QUALIFICATION_RECEIPT_DIRECTORY"
          node dist/cli.js emit-qualification-receipt-set --signed-catalog "$SIGNED_CATALOG_PATH" --catalog-signer-root "$CATALOG_SIGNER_ROOT_PATH" --expected-claims "$EXPECTED_CLAIMS_PATH" --now "$QUALIFICATION_RECEIPT_ISSUED_AT" "${continuity_args[@]}" --replay-state "$REPLAY_STATE_PATH" --output-dir "$QUALIFICATION_RECEIPT_DIRECTORY" --manifest-output "$QUALIFICATION_RECEIPT_SET_PATH"
          test "$(sha256sum "$QUALIFICATION_RECEIPT_SET_PATH" | awk '{print $1}')" = "$EXPECTED_QUALIFICATION_RECEIPT_SET_SHA256"
          QUALIFICATION_RECEIPT_SET_PATH="$QUALIFICATION_RECEIPT_SET_PATH" QUALIFICATION_RECEIPT_DIRECTORY="$QUALIFICATION_RECEIPT_DIRECTORY" SIGNED_CATALOG_PATH="$SIGNED_CATALOG_PATH" EXPECTED_NOW="$QUALIFICATION_RECEIPT_ISSUED_AT" node --input-type=module -e "import fs from'node:fs';import path from'node:path';import crypto from'node:crypto';import{parseQualificationReceiptSetV1Json,parseQualificationReceiptV2Json}from'./dist/index.js';const s=parseQualificationReceiptSetV1Json(fs.readFileSync(process.env.QUALIFICATION_RECEIPT_SET_PATH,'utf8')),h=JSON.parse(Buffer.from(JSON.parse(fs.readFileSync(process.env.SIGNED_CATALOG_PATH)).envelope.payload,'base64')).predicate.catalogHead,m=new Map(h.entries.map(x=>[x.entryId,x])),f=fs.readdirSync(process.env.QUALIFICATION_RECEIPT_DIRECTORY,{withFileTypes:true});if(f.some(x=>!x.isFile()||x.isSymbolicLink())||f.length!==s.entries.length||s.entries.length!==m.size)process.exit(2);for(const e of s.entries){const b=fs.readFileSync(path.resolve(path.dirname(process.env.QUALIFICATION_RECEIPT_SET_PATH),e.path)),r=parseQualificationReceiptV2Json(b.toString('utf8')),x=m.get(e.entryId);if(!x||r.entryId!==e.entryId||e.memberDigest!==\`sha256:\${x.memberSha256}\`||e.receiptSha256!==crypto.createHash('sha256').update(b).digest('hex')||r.qualificationBasis.catalogMemberDigest!==e.memberDigest||Date.parse(r.notBefore)>Date.parse(process.env.EXPECTED_NOW)||Date.parse(process.env.EXPECTED_NOW)>=Date.parse(r.expiresAt))process.exit(2)}"
          node -e "const fs=require('node:fs');const s=JSON.parse(fs.readFileSync(process.env.SIGNED_CATALOG_PATH)),p=JSON.parse(Buffer.from(s.envelope.payload,'base64')).predicate,h=p.catalogHead;fs.writeFileSync(process.env.EMBEDDED_CATALOG_HEAD_PATH,JSON.stringify(h));fs.writeFileSync(process.env.CANDIDATE_SIGNER_PATH,JSON.stringify(p.signer));fs.writeFileSync(process.env.CANDIDATE_METADATA_PATH,JSON.stringify({validFrom:h.validFrom,validUntil:h.validUntil,sequence:String(h.sequence),previous:h.previousCatalogHeadSha256}))"
          node dist/cli.js generate-candidate --seed-manifest defaults/default-catalog-seed-manifest-v2.json --signer "$CANDIDATE_SIGNER_PATH" --claims "$EXPECTED_CLAIMS_PATH" --valid-from "$(node -e "process.stdout.write(require('./candidate-metadata.json').validFrom)")" --valid-until "$(node -e "process.stdout.write(require('./candidate-metadata.json').validUntil)")" --sequence "$(node -e "process.stdout.write(require('./candidate-metadata.json').sequence)")" --previous-catalog-head-sha256 "$(node -e "process.stdout.write(require('./candidate-metadata.json').previous)")" --output "$REGENERATED_CANDIDATE_PATH"
          cmp "$REGENERATED_CANDIDATE_PATH" "$EMBEDDED_CATALOG_HEAD_PATH"
          OBSERVED_NOW="$QUALIFICATION_RECEIPT_ISSUED_AT" node --input-type=module -e "import fs from'node:fs';import{planCatalogPromotionV2}from'./dist/index.js';const c=v=>v===null||typeof v!=='object'?JSON.stringify(v):Array.isArray(v)?'['+v.map(c).join(',')+']':'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+c(v[k])).join(',')+'}';const candidate=JSON.parse(fs.readFileSync(process.env.REGENERATED_CANDIDATE_PATH)),last=process.env.CONTINUITY_MODE==='successor'?JSON.parse(fs.readFileSync(process.env.LAST_ACCEPTED_HEAD_PATH)):null,plan=last?planCatalogPromotionV2({candidateHead:candidate,lastGood:last,now:process.env.OBSERVED_NOW}):{kind:'genesis',facts:[]};fs.writeFileSync(process.env.PROMOTION_PLAN_PATH,c({candidateCatalogHeadSha256:candidate.catalogHeadSha256,facts:plan.facts??[],kind:plan.kind,lastGoodCatalogHeadSha256:last?.catalogHeadSha256??null}))"
          cp "$SIGNED_CATALOG_PATH" "$CANDIDATE_ARTIFACT_PATH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-catalog-v2
          path: |
            ${{ env.CANDIDATE_ARTIFACT_PATH }}
            ${{ env.PROMOTION_PLAN_PATH }}
            ${{ env.QUALIFICATION_RECEIPT_SET_PATH }}
            ${{ env.QUALIFICATION_RECEIPT_DIRECTORY }}

  sign:
    needs: candidate
    environment: catalog-signing
    permissions:
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    env:
      EXPECTED_SIGNED_CATALOG_SHA256: ${{ inputs.signed_catalog_sha256 }}
      EXPECTED_PROMOTION_PLAN_SHA256: ${{ inputs.promotion_plan_sha256 }}
      EXPECTED_QUALIFICATION_RECEIPT_SET_SHA256: ${{ inputs.qualification_receipt_set_sha256 }}
      EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
      ACTUAL_DISPATCH_SHA: ${{ github.sha }}
      SIGNED_CATALOG_PATH: signed-catalog-v2/signed-catalog-v2.json
      PROMOTION_PLAN_PATH: signed-catalog-v2/promotion-plan.json
      QUALIFICATION_RECEIPT_SET_PATH: signed-catalog-v2/qualification-receipt-set.json
      QUALIFICATION_RECEIPT_DIRECTORY: signed-catalog-v2/receipts
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-catalog-v2
          path: signed-catalog-v2
      - name: validate catalog digest, canonical manifest, and every receipt
        run: |
          [[ "$EXPECTED_SIGNED_CATALOG_SHA256" =~ ^[0-9a-f]{64}$ && "$EXPECTED_PROMOTION_PLAN_SHA256" =~ ^[0-9a-f]{64}$ && "$EXPECTED_QUALIFICATION_RECEIPT_SET_SHA256" =~ ^[0-9a-f]{64}$ && "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ && "$ACTUAL_DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_COMMIT_SHA" = "$ACTUAL_DISPATCH_SHA"; test "$(sha256sum "$SIGNED_CATALOG_PATH" | awk '{print $1}')" = "$EXPECTED_SIGNED_CATALOG_SHA256"; test "$(sha256sum "$PROMOTION_PLAN_PATH" | awk '{print $1}')" = "$EXPECTED_PROMOTION_PLAN_SHA256"; test "$(sha256sum "$QUALIFICATION_RECEIPT_SET_PATH" | awk '{print $1}')" = "$EXPECTED_QUALIFICATION_RECEIPT_SET_SHA256"
          QUALIFICATION_RECEIPT_SET_PATH="$QUALIFICATION_RECEIPT_SET_PATH" QUALIFICATION_RECEIPT_DIRECTORY="$QUALIFICATION_RECEIPT_DIRECTORY" SIGNED_CATALOG_PATH="$SIGNED_CATALOG_PATH" node -e "const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),canon=v=>v===null||typeof v!=='object'?JSON.stringify(v):Array.isArray(v)?'['+v.map(canon).join(',')+']':'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}',raw=fs.readFileSync(process.env.QUALIFICATION_RECEIPT_SET_PATH),s=JSON.parse(raw),h=JSON.parse(Buffer.from(JSON.parse(fs.readFileSync(process.env.SIGNED_CATALOG_PATH)).envelope.payload,'base64')).predicate.catalogHead,m=new Map(h.entries.map(x=>[x.entryId,x])),f=fs.readdirSync(process.env.QUALIFICATION_RECEIPT_DIRECTORY,{withFileTypes:true});if(raw.length>32768||raw.toString()!==canon(s)||s.format!=='aih-supported-qualification-receipt-set'||s.version!==1||!Array.isArray(s.entries)||s.entries.length<1||s.entries.length>64||f.some(x=>!x.isFile()||x.isSymbolicLink())||f.length!==s.entries.length||s.entries.length!==m.size)process.exit(2);let before='';for(const e of s.entries){if(!e||Object.keys(e).sort().join(',')!=='entryId,memberDigest,path,receiptSha256'||!(/^[a-z][a-z0-9.-]{0,63}$/).test(e.entryId)||e.entryId<=before||e.path!==\`receipts/\${e.entryId}.json\`||!(/^sha256:[0-9a-f]{64}$/).test(e.memberDigest)||!(/^[0-9a-f]{64}$/).test(e.receiptSha256))process.exit(2);before=e.entryId;const x=m.get(e.entryId),b=fs.readFileSync(path.resolve(path.dirname(process.env.QUALIFICATION_RECEIPT_SET_PATH),e.path)),r=JSON.parse(b);if(!x||b.length>5970||crypto.createHash('sha256').update(b).digest('hex')!==e.receiptSha256||b.toString()!==canon(r)||r.entryId!==e.entryId||canon(r.subject)!==canon(x.subject)||e.memberDigest!==\`sha256:\${x.memberSha256}\`||r.qualificationBasis?.catalogMemberDigest!==e.memberDigest||r.qualificationBasis?.catalogHeadDigest!==\`sha256:\${h.catalogHeadSha256}\`||r.catalogContinuity?.catalogHeadDigest!==\`sha256:\${h.catalogHeadSha256}\`)process.exit(2)}"
          echo "signed-catalog keyless provenance records the already-admitted administrator Ed25519 DSSE artifact."
          echo "GitHub attestation keyless provenance records a separately authorized public transparency publication effect."
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ env.SIGNED_CATALOG_PATH }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ env.QUALIFICATION_RECEIPT_SET_PATH }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ env.QUALIFICATION_RECEIPT_DIRECTORY }}/*.json

  verify:
    needs: sign
    permissions:
      contents: read
      attestations: read
    runs-on: ubuntu-latest
    env:
      EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
      ACTUAL_DISPATCH_SHA: ${{ github.sha }}
      EXPECTED_REF: ${{ github.ref }}
      EXPECTED_REPOSITORY: ${{ github.repository }}
      EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
      EXPECTED_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
      EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
      EXPECTED_EVENT_NAME: ${{ github.event_name }}
      EXPECTED_SIGNED_CATALOG_SHA256: ${{ inputs.signed_catalog_sha256 }}
      EXPECTED_PROMOTION_PLAN_SHA256: ${{ inputs.promotion_plan_sha256 }}
      EXPECTED_QUALIFICATION_RECEIPT_SET_SHA256: ${{ inputs.qualification_receipt_set_sha256 }}
      QUALIFICATION_RECEIPT_ISSUED_AT: ${{ inputs.qualification_receipt_issued_at }}
      SIGNED_CATALOG_PATH: signed-catalog-v2/signed-catalog-v2.json
      PROMOTION_PLAN_PATH: signed-catalog-v2/promotion-plan.json
      QUALIFICATION_RECEIPT_SET_PATH: signed-catalog-v2/qualification-receipt-set.json
      QUALIFICATION_RECEIPT_DIRECTORY: signed-catalog-v2/receipts
      RECOMPUTED_QUALIFICATION_RECEIPT_SET_PATH: recomputed-qualification-receipt-set.json
      RECOMPUTED_QUALIFICATION_RECEIPT_DIRECTORY: recomputed-receipts
      REPLAY_STATE_PATH: qualification-receipt-replay-state.json
      CATALOG_SIGNER_ROOT_PATH: ${{ inputs.catalog_signer_root_path }}
      CONTINUITY_MODE: ${{ inputs.continuity_mode }}
      LAST_ACCEPTED_HEAD_PATH: ${{ inputs.last_accepted_head_path }}
      EXPECTED_LAST_ACCEPTED_HEAD_SHA256: ${{ inputs.last_accepted_head_sha256 }}
      EXPECTED_CLAIMS_PATH: catalog-expected-claims.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-catalog-v2
          path: signed-catalog-v2
      - name: recompute and compare every receipt selected by the manifest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ && "$ACTUAL_DISPATCH_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SIGNED_CATALOG_SHA256" =~ ^[0-9a-f]{64}$ && "$EXPECTED_PROMOTION_PLAN_SHA256" =~ ^[0-9a-f]{64}$ && "$EXPECTED_QUALIFICATION_RECEIPT_SET_SHA256" =~ ^[0-9a-f]{64}$ && "$EXPECTED_REF" =~ ^refs/heads/main$ ]]
          test "$EXPECTED_COMMIT_SHA" = "$ACTUAL_DISPATCH_SHA" && test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"; test "$(sha256sum "$SIGNED_CATALOG_PATH" | awk '{print $1}')" = "$EXPECTED_SIGNED_CATALOG_SHA256"; test "$(sha256sum "$PROMOTION_PLAN_PATH" | awk '{print $1}')" = "$EXPECTED_PROMOTION_PLAN_SHA256"; test "$(sha256sum "$QUALIFICATION_RECEIPT_SET_PATH" | awk '{print $1}')" = "$EXPECTED_QUALIFICATION_RECEIPT_SET_SHA256"
          safe_workspace_file() { local requested="$1" workspace resolved; [[ "$requested" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ && "$requested" != *".."* ]]; workspace=$(realpath -e "$GITHUB_WORKSPACE"); resolved=$(realpath -e "$GITHUB_WORKSPACE/$requested"); [[ "$resolved" == "$workspace/"* ]] && ! test -L "$GITHUB_WORKSPACE/$requested" && git ls-files --error-unmatch -- "$requested" >/dev/null; }
          safe_workspace_file "$CATALOG_SIGNER_ROOT_PATH"
          if [[ "$CONTINUITY_MODE" == genesis ]]; then [[ -z "$LAST_ACCEPTED_HEAD_PATH" && -z "$EXPECTED_LAST_ACCEPTED_HEAD_SHA256" ]]; continuity_args=(--continuity genesis); elif [[ "$CONTINUITY_MODE" == successor ]]; then [[ "$EXPECTED_LAST_ACCEPTED_HEAD_SHA256" =~ ^[0-9a-f]{64}$ ]]; safe_workspace_file "$LAST_ACCEPTED_HEAD_PATH"; test "$(sha256sum "$LAST_ACCEPTED_HEAD_PATH" | awk '{print $1}')" = "$EXPECTED_LAST_ACCEPTED_HEAD_SHA256"; continuity_args=(--last-accepted-head "$LAST_ACCEPTED_HEAD_PATH"); else exit 2; fi
          npm ci --ignore-scripts && npm run build; node -e "const fs=require('node:fs');fs.writeFileSync(process.env.EXPECTED_CLAIMS_PATH,JSON.stringify({environment:'catalog-signing',eventName:process.env.EXPECTED_EVENT_NAME,issuer:'https://token.actions.githubusercontent.com',jobWorkflowRef:process.env.EXPECTED_WORKFLOW_REF,ref:process.env.EXPECTED_REF,repository:process.env.EXPECTED_REPOSITORY,repositoryId:process.env.EXPECTED_REPOSITORY_ID,repositoryOwnerId:process.env.EXPECTED_REPOSITORY_OWNER_ID}))"
          node dist/cli.js inspect --signed-catalog "$SIGNED_CATALOG_PATH" --catalog-signer-root "$CATALOG_SIGNER_ROOT_PATH" --expected-claims "$EXPECTED_CLAIMS_PATH" --now "$QUALIFICATION_RECEIPT_ISSUED_AT" "${continuity_args[@]}"
          printf '%s' '{"acceptedIdentities":[]}' > "$REPLAY_STATE_PATH"; mkdir "$RECOMPUTED_QUALIFICATION_RECEIPT_DIRECTORY"
          node dist/cli.js emit-qualification-receipt-set --signed-catalog "$SIGNED_CATALOG_PATH" --catalog-signer-root "$CATALOG_SIGNER_ROOT_PATH" --expected-claims "$EXPECTED_CLAIMS_PATH" --now "$QUALIFICATION_RECEIPT_ISSUED_AT" "${continuity_args[@]}" --replay-state "$REPLAY_STATE_PATH" --output-dir "$RECOMPUTED_QUALIFICATION_RECEIPT_DIRECTORY" --manifest-output "$RECOMPUTED_QUALIFICATION_RECEIPT_SET_PATH"
          cmp "$QUALIFICATION_RECEIPT_SET_PATH" "$RECOMPUTED_QUALIFICATION_RECEIPT_SET_PATH" && test "$(sha256sum "$RECOMPUTED_QUALIFICATION_RECEIPT_SET_PATH" | awk '{print $1}')" = "$EXPECTED_QUALIFICATION_RECEIPT_SET_SHA256"
          QUALIFICATION_RECEIPT_SET_PATH="$QUALIFICATION_RECEIPT_SET_PATH" QUALIFICATION_RECEIPT_DIRECTORY="$QUALIFICATION_RECEIPT_DIRECTORY" RECOMPUTED_QUALIFICATION_RECEIPT_DIRECTORY="$RECOMPUTED_QUALIFICATION_RECEIPT_DIRECTORY" node -e "const fs=require('node:fs');const s=JSON.parse(fs.readFileSync(process.env.QUALIFICATION_RECEIPT_SET_PATH)),e=new Set(s.entries.map(x=>x.path)),f=fs.readdirSync(process.env.QUALIFICATION_RECEIPT_DIRECTORY,{withFileTypes:true});if(f.length!==e.size||f.some(x=>!x.isFile()||x.isSymbolicLink()||!e.has('receipts/'+x.name)))process.exit(2);for(const x of s.entries){const n=x.path.slice(9);if(!fs.readFileSync(process.env.QUALIFICATION_RECEIPT_DIRECTORY+'/'+n).equals(fs.readFileSync(process.env.RECOMPUTED_QUALIFICATION_RECEIPT_DIRECTORY+'/'+n)))process.exit(2)}"
      - name: verify outer attestations for manifest and every receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_args=(--repo "$EXPECTED_REPOSITORY" --source-digest "$EXPECTED_COMMIT_SHA" --signer-workflow "$EXPECTED_REPOSITORY/.github/workflows/signed-catalog-v2.yml" --source-ref refs/heads/main --deny-self-hosted-runners)
          gh attestation verify "$SIGNED_CATALOG_PATH" "${verify_args[@]}"
          gh attestation verify "$QUALIFICATION_RECEIPT_SET_PATH" "${verify_args[@]}"
          node -e "const fs=require('node:fs');for(const e of JSON.parse(fs.readFileSync(process.env.QUALIFICATION_RECEIPT_SET_PATH)).entries)process.stdout.write(e.path+'\\n')" | while IFS= read -r receipt; do gh attestation verify "signed-catalog-v2/$receipt" "${verify_args[@]}"; done
