name: signed catalog v2
on:
  workflow_dispatch:
    inputs:
      commit_sha: { required: true, type: string }
      signed_catalog_sha256: { required: true, type: string }
jobs:
  candidate:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    env:
      EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
      EXPECTED_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: ${{ env.EXPECTED_COMMIT_SHA }}, persist-credentials: false }
      - run: |
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_REF" =~ ^refs/heads/[a-z0-9._/-]+$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          git merge-base --is-ancestor "$EXPECTED_COMMIT_SHA" "origin/${EXPECTED_REF#refs/heads/}"
          node dist/cli.js inspect --signed-catalog signed.json --catalog-signer-root root.json --expected-claims claims.json --now 2026-08-22T00:00:00Z --continuity genesis
      - uses: actions/upload-artifact@50769540e7ff2f6a9dbb8b0f9cdbb7b1d4b4d0ad
  sign:
    needs: candidate
    environment: catalog-signing
    permissions: { attestations: write, id-token: write }
    runs-on: ubuntu-latest
    env:
      EXPECTED_SIGNED_CATALOG_SHA256: ${{ inputs.signed_catalog_sha256 }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      - run: |
          [[ "$EXPECTED_SIGNED_CATALOG_SHA256" =~ ^[0-9a-f]{64}$ ]]
          actual_catalog_sha256=$(sha256sum signed.json | awk '{print $1}')
          test "$actual_catalog_sha256" = "$EXPECTED_SIGNED_CATALOG_SHA256"
      - uses: actions/attest-build-provenance@1c3a1a44d3d4e7c8cb4b8cd0aa0e6f5b01ba2d30
  verify:
    needs: sign
    permissions: { contents: read, attestations: read }
    runs-on: ubuntu-latest
    env:
      EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
      EXPECTED_REF: ${{ github.ref }}
      EXPECTED_REPOSITORY: ${{ github.repository }}
      EXPECTED_SIGNED_CATALOG_SHA256: ${{ inputs.signed_catalog_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: ${{ env.EXPECTED_COMMIT_SHA }}, persist-credentials: false }
      - run: |
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SIGNED_CATALOG_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_REF" =~ ^refs/heads/[a-z0-9._/-]+$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          node dist/cli.js inspect --signed-catalog signed.json --catalog-signer-root root.json --expected-claims claims.json --now 2026-08-22T00:00:00Z --continuity genesis
          test "$(sha256sum signed.json | awk '{print $1}')" = "$EXPECTED_SIGNED_CATALOG_SHA256"
          gh attestation verify "$SIGNED_CATALOG_PATH" --repo "$EXPECTED_REPOSITORY" --source-digest "$EXPECTED_COMMIT_SHA"
