name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Catalog migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check hook selectors against prior committed release
        env:
          AIHQ_RELEASE_BASELINE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: npm run build:dist && npm run check:materials
      - name: Verify retained material and producer integrity
        run: npm run verify
      - run: npm audit --audit-level=high
      - run: git diff --check
