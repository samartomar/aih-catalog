name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Catalog integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build, embedded profiles, typecheck, lint, tests (including the packed file list) and action pins
        run: npm run verify
      - name: Packed public-consumer journeys (the exact npm pack tarball, offline, in a disposable consumer)
        run: npm run check:consumer
      - run: npm audit --audit-level=high
      - run: git diff --check
