name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: samartomar/ai-harness
          ref: aa93128ff56b3ed978ec428e29d1b1ce8036e53b
          path: core-source
          fetch-depth: 2
          persist-credentials: false
      - run: npm run verify:core-v2-lock -- --core-root ${{ github.workspace }}/core-source
      - run: npm test -- tests/contracts/catalog-package-identity.test.ts
        env:
          AIH_SUPPORTED_CORE_SOURCE: ${{ github.workspace }}/core-source
      - run: npm run verify:default-evidence-chain
      - run: npm run verify:workflow-action-pins
      - run: npm run test:cov
      - run: npm audit --audit-level=high
      - run: git diff --check

  cold-external-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: samartomar/ai-harness
          ref: aa93128ff56b3ed978ec428e29d1b1ce8036e53b
          path: core-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:cold-external-admin
        env:
          AIH_SUPPORTED_CORE_SOURCE: ${{ github.workspace }}/core-source
