name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Catalog integrity (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
      - name: Make Git's shell available after Windows system tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"PATH=$env:PATH;$env:ProgramFiles\Git\usr\bin" >> $env:GITHUB_ENV'
      - run: npm ci --ignore-scripts
      - name: Build, embedded profiles, typecheck, lint, tests (including the packed file list) and action pins
        run: npm run verify
      - name: Packed public-consumer journeys (the exact npm pack tarball, offline, in a disposable consumer)
        run: npm run check:consumer
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: git diff --check
